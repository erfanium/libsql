syntax = "proto3";
package wal_log;

import "metadata.proto";

message LogOffset {
    uint64 next_offset = 1;
    enum WalFlavor {
        Sqlite = 0;
        Libsql = 1;
    }
    // the type of wal frames that the client is expecting
    optional WalFlavor wal_flavor = 2;
}

message HelloRequest {
    optional uint64 handshake_version = 1;
}

message HelloResponse {
    /// Uuid of the current generation
    string generation_id = 1;
    /// First frame_no in the current generation
    uint64 generation_start_index = 2;
    /// id of the replicated log
    string log_id = 3;
    /// string-encoded Uuid v4 token for the current session, changes on each restart, and must be passed in subsequent requests header.string
    /// If the header session token fails to match the current session token, a NO_HELLO error is returned
    bytes session_token = 4;
    optional uint64 current_replication_index = 5;
    metadata.DatabaseConfig config = 6;
}

message Frame {
    bytes data = 1;
    // if this frames is a commit frame, then this can be set
    // to the time when the transaction was commited
    optional int64 timestamp = 2;
    optional uint64 durable_frame_no = 3;
}

message Frames {
    repeated Frame frames = 1;
}

// What the replica holds once it committed the frames: the parameters of its next sync
message SyncTrailer {
    string log_id = 1;
    uint64 next_offset = 2;
}

// The response could not be completed: what was received of it is discarded
message SyncError {
    string message = 1;
}

// The body of the response to `GET /sync?next_offset=..&log_id=..` is a stream of these, each
// one length-delimited (a varint of its size before it): the frames that bring the replica to
// the primary's current index, then the trailer. A response without it is incomplete. The
// frames form a single transaction and are applied in the order received: a later frame
// replaces the page of an earlier one, and the last one is a commit frame. A failure once the
// response is started is an error in place of the next message. A replica skips the messages
// it does not know.
//
// About how many frames follow is in the `x-sync-estimated-frames` header of the response:
// only good for showing progress.
//
// A replica that sends no log_id is cloned: the frames start from frame 0 and go into an empty
// database. A log_id that is not the primary's, or a next_offset past the end of its log, is
// not answered with frames but refused with a 409 LOG_MISMATCH.
message SyncResponse {
    oneof message {
        bytes frame = 1;
        SyncTrailer trailer = 2;
        SyncError error = 3;
    }
}

service ReplicationLog {
    rpc Hello(HelloRequest) returns (HelloResponse) {}
    rpc LogEntries(LogOffset) returns (stream Frame) {}
    rpc BatchLogEntries(LogOffset) returns (Frames) {}
    rpc Snapshot(LogOffset) returns (stream Frame) {}
}
