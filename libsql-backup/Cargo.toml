[package]
name = "libsql-backup"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Page-level S3 backups of sqld namespaces, pulled over sqld's /sync HTTP route"

[dependencies]
anyhow = "1.0.66"
async-compression = { version = "0.4.4", features = ["tokio", "zstd"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
axum = "0.6.18"
bytes = "1"
chrono = { version = "0.4.26", features = ["serde"] }
clap = { version = "4.0.23", features = ["derive", "env"] }
futures = "0.3.25"
humantime = "2"
prost = "0.12"
reqwest = { version = "0.11.16", features = ["json", "rustls-tls", "stream"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.7.0"
thiserror = "1"
tokio = { version = "=1.38", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1.37"
tracing-subscriber = { version = "0.3.16", features = ["env-filter"] }

[dev-dependencies]
libsql_replication = { workspace = true }
rusqlite = { workspace = true }

[package.metadata.dist]
dist = false
